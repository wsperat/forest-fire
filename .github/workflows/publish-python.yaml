---
name: Publish Python Package
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-release:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine release version
        id: release
        run: |
          git fetch --tags --force
          existing_tag="$(
            git tag --points-at "$GITHUB_SHA" \
              --list 'v[0-9]*.[0-9]*.[0-9]*' \
              | sort -V \
              | tail -n 1
          )"
          if [ -n "$existing_tag" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "version=${existing_tag#v}" >> "$GITHUB_OUTPUT"
            echo "Commit already has release tag $existing_tag;"
            echo "skipping publish."
            exit 0
          fi
          version="$(python scripts/ci_python_release.py next-version)"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Prepared Python release v$version."
  build-wheels:
    name: Build wheel (${{ matrix.os }})
    if: needs.prepare-release.outputs.should_release == 'true'
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release version
        run: >-
          python scripts/ci_python_release.py set-version
          "${{ needs.prepare-release.outputs.version }}"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release
            --out dist
            -m bindings/python/Cargo.toml
            --interpreter 3.12 3.13
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist
  build-sdist:
    name: Build sdist
    if: needs.prepare-release.outputs.should_release == 'true'
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release version
        run: >-
          python scripts/ci_python_release.py set-version
          "${{ needs.prepare-release.outputs.version }}"
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m bindings/python/Cargo.toml
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist
  publish:
    name: Publish to PyPI
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    needs: [prepare-release, build-wheels, build-sdist]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
  tag-release:
    name: Tag release
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    needs: [prepare-release, publish]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push release tag
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
